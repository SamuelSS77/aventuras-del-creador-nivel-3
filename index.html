<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>El Pueblo del Adivino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
:root{
  /* Layout: one centered game screen. HUD and dialogue live inside the stage like a real game; cards and the Bitácora are notebook pages. */
  --night:#1b1a2b; --night-2:#262539; --night-3:#35334e; --muted:#aaa8c2; --highlight:#ffcf70;
  --panel:#2a2238; --panel-2:#3b3152; --cream:#f6efe0; --outline:#2a2238;
  --paper:#eef1e8; --paper-2:#dde3d6; --white:#ffffff; --ink:#1d2a2e; --ink-soft:#526266;
  --adivino:#7a4fc9; --adivino-soft:#e5dbf7; --evid:#2a8a68; --evid-soft:#d3ecdf; --creador:#f08a3c; --warn:#d2483a;
  --chip-int:#d3ecdf; --chip-obs:#f3e3c4; --chip-dat:#d6e3f3;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Kalam","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
body{background:var(--night);color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.45}
#app{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:flex;flex-direction:column;gap:10px}
.stage{position:relative;width:100%;aspect-ratio:960/600;border-radius:16px;overflow:hidden;background:#6fae52;border:3px solid var(--outline);box-shadow:0 0 0 3px var(--night-3),0 10px 30px rgba(0,0,0,.35)}
canvas#cv{display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer}
.hud{position:absolute;left:10px;top:10px;max-width:min(46%,320px);pointer-events:none}
.hud-card{background:rgba(42,34,56,.9);color:var(--cream);border:2px solid var(--outline);border-radius:12px;padding:7px 12px 8px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.hud-time{font-family:var(--f-display);font-weight:700;font-size:clamp(11px,1.6vw,15px);color:var(--highlight);line-height:1.2}
.hud-list{list-style:none;margin:4px 0 0;padding:0;font-size:clamp(10px,1.4vw,14px);line-height:1.35;display:flex;flex-direction:column;gap:2px}
.hud-list li{display:flex;gap:7px;align-items:baseline;opacity:.72}
.hud-list li::before{content:"";flex:none;width:.75em;height:.75em;border:2px solid var(--cream);border-radius:3px;transform:translateY(.12em)}
.hud-list li.done{opacity:.5;text-decoration:line-through}
.hud-list li.done::before{background:var(--evid);border-color:#7fd8b2}
.hud-list li.now{opacity:1;font-weight:700}
.hud-list li.now::before{border-color:var(--highlight)}
.hud-list li.warn{opacity:1;color:#ff9c86;font-weight:700}
.hud-list li.warn::before{border-color:#ff9c86;background:#ff9c86}
.hud.compact .hud-list{display:none}
.hud-bit{position:absolute;right:10px;top:10px;display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:700;font-size:clamp(12px,1.6vw,15px);background:var(--cream);color:var(--outline);border:2px solid var(--outline);border-radius:12px;padding:4px 10px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.hud-bit svg{width:1.3em;height:1.3em;flex:none}
.hud-bit .n{background:var(--evid);color:var(--white);border-radius:999px;min-width:22px;padding:0 6px;font-size:12px;text-align:center;font-variant-numeric:tabular-nums}
.pulse{animation:pulse .7s ease-out}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.dialog{position:absolute;left:10px;right:10px;bottom:10px;background:var(--panel);color:var(--cream);border:3px solid var(--outline);border-radius:14px;padding:10px 14px 8px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:5px;align-items:start;max-height:calc(100% - 20px);overflow:auto;box-shadow:0 4px 0 rgba(0,0,0,.3),inset 0 0 0 2px var(--panel-2)}
.portrait{grid-column:1;grid-row:1 / span 5;width:clamp(54px,11vw,104px);height:auto;aspect-ratio:1;border-radius:12px;background:var(--panel-2);border:2px solid #4a3f63}
.dlg-name,.dlg-tag,.dlg-text,.dlg-choices,.dlg-hint{grid-column:2}
.dlg-name{justify-self:start;font-family:var(--f-display);font-weight:700;color:var(--outline);font-size:14px;padding:0 10px;border-radius:999px;border:2px solid var(--outline)}
.dlg-tag{justify-self:start;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;color:var(--white)}
.dlg-tag.good{background:var(--evid)}
.dlg-tag.bad{background:var(--adivino)}
.dlg-text{font-size:clamp(14px,2vw,19px);text-wrap:pretty;max-width:70ch;min-height:2.6em}
.dialog.think .dlg-text{font-style:italic;color:#ddd3f0}
.dlg-choices{display:flex;flex-direction:column;gap:6px}
.dlg-choices:empty{display:none}
.choice{font:inherit;font-size:clamp(14px,1.9vw,17px);text-align:left;display:flex;gap:10px;align-items:flex-start;background:var(--panel-2);border:2px solid #5a4d74;border-radius:10px;padding:7px 12px;cursor:pointer;color:var(--cream)}
.choice:hover{border-color:var(--highlight);background:#463b61}
.choice .k{font-family:var(--f-display);font-weight:700;background:var(--highlight);color:var(--outline);border-radius:6px;min-width:24px;text-align:center;flex:none}
.dlg-hint{justify-self:end;font-size:12px;color:#b9aecf}
.dlg-hint.blink::after{content:" ▼";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--panel);color:var(--cream);border:2px solid #7fd8b2;border-radius:999px;padding:5px 14px;font-size:clamp(11px,1.5vw,14px);font-weight:700;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(15,14,26,.76);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal-card{background-color:var(--paper);background-image:linear-gradient(var(--paper-2) 1px,transparent 1px),linear-gradient(90deg,var(--paper-2) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);border-radius:16px;border:3px solid var(--outline);max-width:660px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px 24px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.modal-card h1{font-family:var(--f-display);font-size:clamp(32px,6vw,48px);line-height:1;margin:6px 0 2px;text-wrap:balance}
.modal-card h2{font-family:var(--f-display);font-size:clamp(22px,4vw,30px);line-height:1.1;margin:2px 0 10px;text-wrap:balance}
.modal-card h3{font-family:var(--f-display);font-size:17px;margin:16px 0 6px}
.modal-card p{margin:0 0 10px;max-width:64ch}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.sub{font-family:var(--f-display);color:var(--adivino);font-weight:600;font-size:19px}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--ink);color:var(--paper)}
.mgbar .btn{background:var(--panel-2);color:var(--cream);border-color:#5a4d74}
.mgbar .btn.primary{background:var(--highlight);color:var(--outline);border-color:var(--outline)}
.btn:focus-visible,.choice:focus-visible,.hud-bit:focus-visible,.evbtn:focus-visible,.opt:focus-visible,.pbtn:focus-visible{outline:3px solid var(--creador);outline-offset:2px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.steps3 div{background:var(--white);border:2px solid var(--ink);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column}
.steps3 b{font-family:var(--f-display)}
.steps3 span{font-size:13px;color:var(--ink-soft)}
.keys{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;margin:8px 0}
kbd{font-family:var(--f-body);font-weight:700;font-size:12px;background:var(--white);border:1.5px solid var(--ink);border-bottom-width:3px;border-radius:5px;padding:0 6px;margin-right:2px}
.small{font-size:13px;color:var(--ink-soft)}
.pred{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:10px 12px;margin:8px 0}
.pred.bad{background:var(--adivino-soft)}
.pred.good{background:var(--evid-soft)}
.pred .mark{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--white);font-weight:700}
.pred.bad .mark{background:var(--adivino)}
.pred.good .mark{background:var(--evid)}
.pred small,.vision small{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pred small{color:var(--ink-soft)}
.pred p{margin:2px 0 0}
.les-list,.les-final{font-family:var(--f-hand);font-size:19px;line-height:1.3;padding-left:24px;margin:4px 0}
.les-list li,.les-final li{margin:5px 0}
.bit-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bit-grid section{min-width:0}
.ev-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.ev,.evbtn{display:flex;flex-direction:column;gap:2px;background:var(--white);border:1.5px solid var(--paper-2);border-radius:10px;padding:8px 10px}
.evbtn{font:inherit;text-align:left;color:var(--ink);cursor:pointer;border:2px solid var(--ink)}
.evbtn:hover:not(:disabled){background:var(--evid-soft)}
.evbtn:disabled{background:var(--adivino-soft);border-color:var(--adivino);opacity:.7;cursor:not-allowed}
.src{align-self:flex-start;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:1px 8px;color:var(--ink)}
.src-entrevista{background:var(--chip-int)}
.src-observacion{background:var(--chip-obs)}
.src-datos{background:var(--chip-dat)}
.empty{color:var(--ink-soft);font-style:italic}
.vision{background:var(--adivino);color:var(--white);border-radius:12px;padding:12px 14px;margin:8px 0}
.vision p{font-family:var(--f-display);font-size:21px;line-height:1.2;margin:2px 0 0}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.fb{color:var(--warn);font-weight:700;margin-top:10px}
blockquote{margin:6px 0 10px;padding:10px 14px;background:var(--white);border-radius:10px;font-size:17px}
.how{background:var(--white);border:2px dashed var(--ink-soft);border-radius:10px;padding:10px 12px}
.purple{color:var(--adivino);font-weight:700}
.green{color:var(--evid);font-weight:700}
.orange{color:#c96a24;font-weight:700}
.blue{color:#2f6fb3;font-weight:700}
.orangeT{color:#c96a24;font-weight:700}
.steps{padding-left:22px;margin:6px 0;display:flex;flex-direction:column;gap:8px;font-size:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{font:inherit;font-weight:700;font-size:14px;display:inline-flex;gap:8px;align-items:center;background:var(--panel-2);color:var(--cream);border:2px solid var(--tc);border-radius:10px;padding:7px 12px;cursor:pointer;min-height:42px}
.tbtn:hover{background:#463b61}
.tbtn kbd{background:var(--tc);color:var(--white);border-color:var(--outline)}
.dilemma{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dbtn{font:inherit;text-align:left;display:flex;flex-direction:column;gap:4px;background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:14px;cursor:pointer}
.dbtn b{font-family:var(--f-display);font-size:20px}
.dbtn:hover{background:var(--evid-soft)}
.dbtn:first-child:hover{background:var(--adivino-soft)}
@media (max-width:520px){.dilemma{grid-template-columns:1fr}}
.metrics{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.metric{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;background:var(--white);border:2px solid var(--ink);border-radius:10px;padding:8px 12px}
.metric b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.metric b small{font-family:var(--f-body);font-size:12px;color:var(--ink-soft);font-weight:400}
.metric .bar{grid-column:1 / -1}
.bar{height:10px;border-radius:5px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.bar i.bad{background:var(--warn)}
.bar i.rutas{background:var(--adivino)}
.bar i.pas{background:var(--evid)}
.dist{display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:center;background:var(--white);border:2px solid var(--ink);border-radius:10px;padding:8px 12px}
.drow b{font-family:var(--f-display)}
.dbars{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.dbars small{font-size:12px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.ba{width:100%;border-collapse:collapse;background:var(--white);border:2px solid var(--ink);font-variant-numeric:tabular-nums;margin:6px 0}
.ba th,.ba td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--paper-2)}
.ba td.b{color:var(--warn);font-weight:700}
.ba td.a{color:var(--evid);font-weight:700}
.facts{list-style:none;padding:0;margin:8px 0 12px;display:flex;flex-direction:column;gap:8px}
.facts li{display:flex;gap:10px;align-items:center;background:var(--white);border:2px solid var(--ink);border-radius:10px;padding:8px 10px}
.sw{flex:none;display:inline-block;width:26px;height:20px;border-radius:5px}
.sw.lane{background:rgba(70,190,120,.55);border:2px solid #2a8a68}
.sw.nook{background:#c49a66;border:2px dashed #1f6e52}
.sw.stall{background:repeating-linear-gradient(45deg,#f39c33 0 4px,#fff3d6 4px 8px);border:2px solid #b5482f}
.persona{background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px}
.p-head{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--evid);flex:none;box-shadow:inset 0 -14px 0 rgba(0,0,0,.15)}
.p-head b{font-family:var(--f-display);font-size:19px}
.p-head small{display:block;font-size:12px;color:var(--ink-soft)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
legend{font-family:var(--f-display);font-weight:700;font-size:16px;margin-bottom:4px;padding:0}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:7px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt:hover:not(:disabled){background:var(--evid-soft)}
.opt:disabled{background:var(--adivino-soft);border-color:var(--adivino);cursor:not-allowed;color:var(--ink-soft)}
.opt.ok{background:var(--evid-soft);border-color:var(--evid);cursor:default}
.opt small{font-size:12px;font-weight:700;color:var(--ink-soft)}
.mgbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--night-2);border:2px solid var(--night-3);border-radius:14px;padding:10px 12px}
.mg-actions{display:flex;flex-wrap:wrap;gap:8px}
.legend3{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--cream);min-width:0}
.legend3 span{display:flex;gap:8px;align-items:center}
.legend3 .sw{width:22px;height:16px}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,40px);gap:4px}
.pbtn{font:inherit;font-size:20px;font-weight:700;border:2px solid #5a4d74;background:var(--panel-2);color:var(--cream);border-radius:8px;cursor:pointer}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--cream)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.status{flex:1 1 100%;margin:0;font-size:15px;color:var(--cream);min-height:1.45em}
.status b{color:var(--highlight)}
.controls{margin:0;font-size:13px;color:var(--muted)}
@media (max-width:620px){.bit-grid{grid-template-columns:1fr}.steps3{grid-template-columns:1fr}.modal-card{padding:16px}.dlg-hint{display:none}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.dlg-hint.blink::after{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage" class="stage">
    <canvas id="cv" width="960" height="600" aria-label="Pantalla del juego"></canvas>
    <div id="hud" class="hud compact" hidden><div class="hud-card"><div id="hudTime" class="hud-time"></div><ul id="hudList" class="hud-list"></ul></div></div>
    <button id="btnBit" class="hud-bit" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="15" height="18" rx="2" fill="#7a4fc9" stroke="#2a2238" stroke-width="2"/><rect x="7" y="3" width="2" height="18" fill="#2a2238"/><path d="M11 8h5M11 12h5M11 16h3" stroke="#f6efe0" stroke-width="2" stroke-linecap="round"/></svg><span>Bitácora</span><span id="bitCount" class="n">0</span></button>
    <div id="dialog" class="dialog" hidden>
      <canvas id="portrait" class="portrait" width="120" height="120" aria-hidden="true"></canvas>
      <div id="dlgName" class="dlg-name"></div>
      <div id="dlgTag" class="dlg-tag" hidden></div>
      <div id="dlgText" class="dlg-text"></div>
      <div id="dlgChoices" class="dlg-choices"></div>
      <div id="dlgHint" class="dlg-hint"></div>
    </div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <div id="mgbar" class="mgbar" hidden></div>
  <p class="controls">Moverse: flechas o WASD (o clic en el suelo) · Hablar y continuar: E o Espacio · Bitácora: B</p>
</div>
<div id="modal" class="modal" hidden><div id="modalCard" class="modal-card" role="dialog" aria-modal="true"></div></div>

<script>
(()=>{
'use strict';
const W=960,H=600;
const $=id=>document.getElementById(id);
const cv=$('cv'),mainCtx=cv.getContext('2d');let ctx=mainCtx;
const pcv=$('portrait'),pctx=pcv.getContext('2d');
const dlg=$('dialog'),dlgName=$('dlgName'),dlgTag=$('dlgTag'),dlgText=$('dlgText'),dlgChoices=$('dlgChoices'),dlgHint=$('dlgHint');
const modal=$('modal'),modalCard=$('modalCard'),toastEl=$('toast'),mgbar=$('mgbar');
const hud=$('hud'),hudTime=$('hudTime'),hudList=$('hudList'),btnBit=$('btnBit'),bitCount=$('bitCount');
const OUT='#2a2238';
const COL={adiv:'#7a4fc9',adivDark:'#4b2d8f',adivSoft:'#e3d8f6',evid:'#2a8a68',evidSoft:'#d3ecdf',ink:'#1d2a2e',inkSoft:'#526266',
  player:'#f08a3c',rock:'#8a8c84',stairs:'#cdb790',stairsLine:'#a48e66',warn:'#d2483a',white:'#ffffff',paper:'#eef1e8',cream:'#f6efe0',
  street:'#e7e0cf',house:'#93a6b7',roof:'#6f8497'};
const CK={
  player:{body:'#f08a3c',dark:'#c96a24'},rosa:{body:'#f283a5',dark:'#cf5f82'},mario:{body:'#f3c24f',dark:'#cf9a2c'},
  tito:{body:'#62bfe8',dark:'#3b97c2'},ernesto:{body:'#b08463',dark:'#8a6245'},taq:{body:'#69b884',dark:'#4a9466'},
  adivino:{body:'#8d62d9',dark:'#653fb0'},c1:{body:'#e98fd0',dark:'#c46aac'},c2:{body:'#f0a35a',dark:'#c97f3a'},c3:{body:'#7fa4e8',dark:'#5a80c4'}
};
const FONT='"Atkinson Hyperlegible", system-ui, sans-serif';
const FONT_D='"Baloo 2", "Trebuchet MS", sans-serif';
const RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const SPK={
  creador:{n:'Creador',k:'player'},piensa:{n:'Creador (piensa)',k:'player',think:true},adivino:{n:'El Adivino',k:'adivino'},
  rosa:{n:'Doña Rosa',k:'rosa'},mario:{n:'Don Mario',k:'mario'},tito:{n:'Tito',k:'tito'},ernesto:{n:'Don Ernesto',k:'ernesto'},
  taq:{n:'Jefe de estación',k:'taq'},pueblo:{n:'El pueblo',k:'crowd'}
};
const EVID={

function startSoko(){
  const walls=new Set(),tg=[],bl=[];let px=0,py=0;
  SOKO_MAP.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch==='#')walls.add(x+','+y);else if(ch==='B')bl.push({x,y});else if(ch==='P'){px=x;py=y;}else if(ch==='n')tg.push({x,y});}));
  S.soko={walls,tg,bl,px,py,hist:[],init:{bl:bl.map(b=>({...b})),px,py},done:false,prev:null,tw:1,cut:0,face:1};
  S.mode='soko';showMgbar('soko');sokoHud();sokoHelp(true);
}
function sokoWall(k,x,y){return x<0||y<0||x>=13||y>=5||k.walls.has(x+','+y);}
function stallBlocked(k){return k.bl.some(b=>STALL.some(([x,y])=>b.x===x&&b.y===y));}
function stored(k){return k.bl.filter(b=>k.tg.some(t=>t.x===b.x&&t.y===b.y)).length;}
function sokoHud(){const k=S.soko;if(!k)return;const n=stored(k),lane=!k.bl.some(b=>b.y===2),sb=stallBlocked(k);
  hudSet('Minijuego 1 · Reacomoda el muro',[{t:`Guarda los bloques en los rincones (${n}/3)`,done:n===3},{t:'Deja libre el centro de la calle',done:lane,plain:!lane},{t:sb?'¡Estás tapando el puesto de Don Mario!':'No tapes el puesto de Don Mario',warn:sb,plain:true}]);}
function sokoMove(dx,dy){
  const k=S.soko;if(!k||k.done||S.modal||D.on)return;
  const nx=k.px+dx,ny=k.py+dy;if(dx)k.face=dx;
  if(sokoWall(k,nx,ny))return;
  const bi=k.bl.findIndex(b=>b.x===nx&&b.y===ny);
  const snap={px:k.px,py:k.py,bl:k.bl.map(b=>({...b}))};
  if(bi>=0){const bx=nx+dx,by=ny+dy;if(sokoWall(k,bx,by)||k.bl.some(b=>b.x===bx&&b.y===by))return;k.bl[bi]={x:bx,y:by};}
  k.hist.push(snap);k.prev=snap;k.tw=0;k.px=nx;k.py=ny;
  const wasBlocked=k.warned;k.warned=stallBlocked(k);
  if(k.warned&&!wasBlocked)toast('Así tapas el puesto de Don Mario. Eso era justo lo que no quería.');
  sokoHud();
  if(stored(k)===3){k.done=true;k.cut=0;toast('¡Calle despejada! Mira a Doña Rosa.');}
}
function sokoUndo(){const k=S.soko;if(!k||k.done||!k.hist.length)return;const h=k.hist.pop();k.px=h.px;k.py=h.py;k.bl=h.bl;k.prev=null;k.tw=1;k.warned=stallBlocked(k);sokoHud();}
function sokoReset(){const k=S.soko;if(!k||k.done)return;k.bl=k.init.bl.map(b=>({...b}));k.px=k.init.px;k.py=k.init.py;k.hist=[];k.prev=null;k.tw=1;k.warned=false;sokoHud();}

function loadPuzzle(i){
  const t=S.tiles,P=TP[i];t.i=i;t.P=P;t.sim=null;t.result=null;
  t.cells=P.grid.map(r=>[...r]);
  t.origins={};t.cells.forEach((row,y)=>row.forEach((ch,x)=>{if(ch==='1'||ch==='2')t.origins[ch]={x,y};}));
  resetArrows();
  setHud(`Minijuego 2 · ${i+1} de 3`,P.need);
  setStatus('Diseña la ruta con flechas y presiona <b>Testear</b>.');
  tilesHelp(true);
}
function resetArrows(){const t=S.tiles;t.arrows={};for(const k in t.P.adiv)t.arrows[k]={d:t.P.adiv[k],adiv:true};t.result=null;}
function tilesClick(mx,my,right){
  const t=S.tiles;if(!t||t.sim||S.modal||D.on)return;
  const g=tilesGeom(),x=Math.floor((mx-g.ox)/g.cs),y=Math.floor((my-g.oy)/g.cs);
  if(x<0||y<0||x>=g.cols||y>=g.rows)return;
  const ch=t.cells[y][x];if(!'.S12'.includes(ch))return;
  const k=x+','+y,a=t.arrows[k];
  t.result=null;
  if(right){delete t.arrows[k];return;}
  if(!a)t.arrows[k]={d:'R'};
  else if(a.adiv)delete t.arrows[k];
  else{const n=CYCLE.indexOf(a.d)+1;if(n>=CYCLE.length)delete t.arrows[k];else a.d=CYCLE[n];}
}
function testear(){
  const t=S.tiles;if(!t||t.sim||S.modal||D.on)return;
  t.result=null;
  t.sim={acc:0,ending:false,used:new Set(),walkers:t.P.walkers.map(w=>{const o=t.origins[w.o];return {...w,x:o.x,y:o.y,fx:o.x,fy:o.y,steps:0,state:'walk',seen:new Set(),msg:''};})};
  setStatus('Probando la ruta con la gente…');
}
function simStep(){
  const t=S.tiles,s=t.sim,g=tilesGeom();
  s.walkers.forEach(w=>{
    w.fx=w.x;w.fy=w.y;
    if(w.state!=='walk')return;
    const k=w.x+','+w.y,a=t.arrows[k];if(a){w.dir=a.d;s.used.add(k);}
    const sk=k+','+w.dir;if(w.seen.has(sk)){w.state='fail';w.msg='Estoy dando vueltas en círculo.';return;}w.seen.add(sk);
    const nx=w.x+DIRS[w.dir][0],ny=w.y+DIRS[w.dir][1];
    if(nx<0||ny<0||nx>=g.cols||ny>=g.rows){w.state='fail';w.msg='Se acabó el camino. Me perdí justo aquí.';return;}
    const ch=t.cells[ny][nx];
    if(ch==='#'){w.state='fail';w.msg='Aquí hay una roca. Me perdí justo aquí.';return;}
    if(ch==='S'&&w.noStairs){w.state='fail';w.msg='Con el carrito no puedo subir escaleras.';return;}
    w.x=nx;w.y=ny;w.steps++;
    if(ch==='D'){w.state='ok';w.msg='¡Llegué!';return;}
    if(ch==='T'){w.state='fail';w.msg='¡Otra vez frente al mirador del Adivino!';return;}
    if(w.max&&w.steps>w.max){w.state='fail';w.msg='¡Llegué tarde! Di demasiadas vueltas.';return;}
    if(w.steps>60){w.state='fail';w.msg='Sigo perdido.';}
  });
  if(!s.walkers.some(w=>w.state==='walk'))finishSim();
}
function updSim(ms){const s=S.tiles.sim;if(!s)return;s.acc+=ms;while(s.acc>=STEP&&!s.ending){s.acc-=STEP;simStep();}}
function finishSim(){
  const t=S.tiles,s=t.sim;if(s.ending)return;s.ending=true;
  setTimeout(()=>{
    if(!S.tiles||S.tiles.sim!==s)return;
    const ok=s.walkers.every(w=>w.state==='ok');
    t.result={walkers:s.walkers.map(w=>({x:w.x,y:w.y,state:w.state,msg:w.msg,name:w.name,ck:w.ck}))};
    t.lastUsed=s.used;t.sim=null;
    if(ok)puzzleOk();else puzzleFail();
  },STEP+250);
}
function puzzleFail(){
  const t=S.tiles;t.fails++;
  const f=t.result.walkers.find(w=>w.state!=='ok');
  setStatus(`<b>${esc(f.name)}:</b> «${esc(f.msg)}» Cambia las flechas y vuelve a testear.`);
  if(!S.les.includes('D'))talk([{s:'piensa',t:'No llegó… pero me mostró exactamente dónde se perdió.'},{s:'piensa',t:'Así funciona: pruebo con la gente, veo dónde falla, lo arreglo y vuelvo a medir.'},()=>addLes('D')]);
}
function puzzleOk(){
  const t=S.tiles,P=t.P;
  const mine=Object.values(t.arrows).filter(a=>!a.adiv).length;
  const before=METRICS[S.mstage||0];S.mstage=Math.min(3,t.i+1);const m=METRICS[S.mstage];
  setStatus(`<b>¡Funcionó!</b> Tablero de la Estación: ${before.ok} → ${m.ok} de cada 100 llegan a su destino.`);
  toast(`Tablero: ${before.ok} → ${m.ok} de cada 100 llegan a su destino`);
  const L=[];
  if(t.i===0)L.push({s:'rosa',t:'¡Llegué al andén del Valle sin una sola escalera! Gracias, joven.'});
  if(t.i===1)L.push({s:'ernesto',t:'Llegué.'},{s:'piensa',t:'Ni un gracias… pero llegó a tiempo. A él las escaleras no le importan: necesita rapidez. Cada usuario necesita algo distinto.'});
  if(t.i===2)L.push({s:'rosa',t:'¡Llegamos los dos!'},{s:'ernesto',t:'…En nueve minutos. Nada mal.'},{s:'piensa',t:'Una sola ruta que les sirve a dos personas con necesidades distintas.'});
  L.push({s:'taq',t:`¡El tablero mejoró! Antes llegaban ${before.ok} de cada 100; ahora llegan ${m.ok}.`});
  if(mine>P.ideal)L.push({s:'piensa',t:`Funcionó, aunque usé ${mine} flechas y se podía con ${P.ideal}. Menos flechas, menos decisiones para la gente.`});
  if(!S.les.includes('D'))L.push({s:'piensa',t:'Cambié algo, lo probé con la gente y medí otra vez. Ahora sé que funcionó: no lo estoy adivinando.'},()=>addLes('D'));
  talk(L,()=>{if(t.i<TP.length-1)loadPuzzle(t.i+1);else tilesWin();});
}

function pzMove(dt){
  const p=S.p,z=S.pz;p.moving=false;if(z.stun>0)return;
  const free=z.phase==='strike'||z.phase==='team'||z.phase==='endA';
  let vx=0,vy=0;if(K.left)vx-=1;if(K.right)vx+=1;if(free){if(K.up)vy-=1;if(K.down)vy+=1;}
  if(vx||vy)p.tx=null;
  else if(p.tx!=null){const dx=p.tx-p.x,dy=free?(p.ty-p.y):0,d=Math.hypot(dx,dy);if(d<5)p.tx=null;else{vx=dx/d;vy=dy/d;}}
  const l=Math.hypot(vx,vy);if(!l)return;
  const sp=4.4*dt;p.x=Math.max(24,Math.min(W-24,p.x+vx/l*sp));
  if(free)p.y=Math.max(228,Math.min(556,p.y+vy/l*sp));
  if(vx)p.face=Math.sign(vx);p.moving=true;
}

  if(p.goal&&distTo(p.goal)<30){const e=p.goal;p.goal=null;p.tx=null;e.act();return;}
  if(S.zone===1&&S.f.wall&&p.x>W-22)zone2();
  else if(S.zone===2&&S.f.tiles&&p.x>W-22)zone3();
}
let last=performance.now();
function loop(now){
  const ms=Math.max(0,Math.min(60,now-last));last=now;const dt=ms/16.667;
  S.t+=dt;
  if(S.fade>0)S.fade=Math.max(0,S.fade-ms/450);
  updTyping(ms);updEnts(dt);updWorld(dt);
  if(S.mode==='tiles'&&S.tiles&&S.tiles.sim)updSim(ms);
  if(S.mode==='plaza'&&S.pz&&!S.modal&&!D.on)updPlaza(dt,ms);
  else if(S.pz&&S.pz.fx){const s=ms/1000;S.pz.fx.forEach(f=>{if(f.t<0)f.t+=s;});}
  if(S.soko){if(S.soko.tw<1)S.soko.tw=Math.min(1,S.soko.tw+ms/120);if(S.soko.done){S.soko.cut+=ms/2600;if(S.soko.cut>=1.35&&!S.soko.won){S.soko.won=true;sokoWin();}}}
  if(S.duel){if(S.duel.shake>0)S.duel.shake-=dt;if(S.duel.shatter>0&&S.duel.shatter<40)S.duel.shatter+=dt;}
  const compact=['tiles','duel','end','plaza'].includes(S.mode);
  if(hud._c!==compact){hud.classList.toggle('compact',compact);hud._c=compact;}
  const showHud=S.mode!=='title';
  if(hud.hidden===showHud){hud.hidden=!showHud;btnBit.hidden=!showHud;}
  draw();
  requestAnimationFrame(loop);
}

/* ---------- Entrada ---------- */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down'};
const SOKO_DIR={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
window.addEventListener('keydown',e=>{
  const c=e.code;
  if(c==='KeyB'){if(!e.repeat)openBit();e.preventDefault();return;}
  if(S.modal){
    if(c==='Escape'&&S.modal==='bit')closeModal();
    if(c==='KeyE'&&!e.repeat){const pr=modalCard.querySelector('[data-primary]');if(pr){e.preventDefault();pr.click();}}
    return;
  }
  if(D.on){
    if(c==='Space'||c==='Enter'||c==='KeyE'){e.preventDefault();if(!e.repeat)adv();}
    else if(/^Digit[1-9]$/.test(c)&&D.cur){e.preventDefault();pick(+c.slice(5)-1);}
    if(KEYMAP[c])e.preventDefault();
    return;
  }
  if(S.mode==='world'){
    if(KEYMAP[c]){K[KEYMAP[c]]=true;e.preventDefault();}
    if((c==='KeyE'||c==='Space'||c==='Enter')&&!e.repeat){e.preventDefault();const n=nearest();if(n)n.act();}
  }else if(S.mode==='soko'){
    const m=SOKO_DIR[KEYMAP[c]];
    if(m){e.preventDefault();const now=performance.now();if(e.repeat&&now-lastSoko<130)return;lastSoko=now;sokoMove(m[0],m[1]);}
    else if(c==='KeyZ')sokoUndo();else if(c==='KeyR')sokoReset();
  }else if(S.mode==='tiles'){
    if(c==='Enter'||c==='KeyT'){e.preventDefault();testear();}
    if(KEYMAP[c]||c==='Space')e.preventDefault();
  }else if(S.mode==='plaza'){
    if(KEYMAP[c]){K[KEYMAP[c]]=true;e.preventDefault();}
    const m=/^(Digit|Numpad)([1-3])$/.exec(c);
    if(m&&!e.repeat){e.preventDefault();plazaAction(+m[2]);}
    if(c==='Space')e.preventDefault();
  }
});
window.addEventListener('keyup',e=>{if(KEYMAP[e.code])K[KEYMAP[e.code]]=false;});
window.addEventListener('blur',()=>{for(const k in K)K[k]=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',ev=>{
  const r=cv.getBoundingClientRect(),mx=(ev.clientX-r.left)*W/r.width,my=(ev.clientY-r.top)*H/r.height;
  if(D.on){adv();return;}
  if(S.modal)return;
  if(S.mode==='world'){
    const e=entAt(mx,my);
    if(e){if(distTo(e)<30)e.act();else{S.p.goal=e;S.p.tx=e.x;S.p.ty=e.y;}}
    else{S.p.goal=null;S.p.tx=mx;S.p.ty=Math.max(222,Math.min(398,my));}
  }else if(S.mode==='tiles')tilesClick(mx,my,ev.button===2);
  else if(S.mode==='plaza'&&S.pz)plazaClick(mx,my);
  else if(S.mode==='soko'&&S.soko){const g=sokoGeom(),px=g.ox+(S.soko.px+.5)*g.cs,py=g.oy+(S.soko.py+.5)*g.cs,dx=mx-px,dy=my-py;if(Math.abs(dx)>Math.abs(dy))sokoMove(Math.sign(dx),0);else if(dy)sokoMove(0,Math.sign(dy));}
});
btnBit.addEventListener('click',()=>{btnBit.blur();openBit();});

/* ---------- Inicio ---------- */
function showTitle(){
  S.mode='title';
  showModal(`<div class="eyebrow">Las aventuras del Creador · Nivel 3</div><h1>El Pueblo del Adivino</h1><p class="sub">Materia: Análisis de Usuario</p>
  <p>Un pueblo entero diseñado a partir de las visiones de un adivino que nunca le preguntó nada a nadie. Para cruzarlo tendrás que hacer lo que él nunca hizo: entender a la gente.</p>
  <div class="steps3"><div><b>Tiempo 1</b><span>Entrevistar</span></div><div><b>Tiempo 2</b><span>Medir y probar</span></div><div><b>Tiempo 3</b><span>Sintetizar</span></div></div>
  <div class="keys"><span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> o <kbd>WASD</kbd> moverte (o clic en el suelo)</span><span><kbd>E</kbd> o <kbd>Espacio</kbd> hablar y continuar</span><span><kbd>B</kbd> abrir tu Bitácora</span></div>
  <p class="small">Versión beta.</p>
  <div class="row"><span class="small">Acceso directo:</span><button class="btn" type="button" data-act="t2">Tiempo 2</button><button class="btn" type="button" data-act="t3">Tiempo 3</button><button class="btn primary" type="button" data-act="go" data-primary>Empezar</button></div>`,{kind:'title',actions:{go:()=>{closeModal();zone1();introZ1();},t2:()=>jumpTo(2),t3:()=>jumpTo(3)}});
}
function jumpTo(n){
  closeModal();hideMgbar();dlg.hidden=true;D.on=false;D.q=[];D.cur=null;D.done=null;D.typing=false;
  S.f={};S.ev=[];S.les=[];S.duel=null;S.soko=null;S.tiles=null;S.mstage=0;
  if(n>=2){S.f.i_rosa=S.f.i_mario=S.f.i_tito=S.f.wall=true;S.ev.push('rosa','mario','tito');S.les.push('A','B');}
  if(n>=3){S.f.metricas=S.f.tiles=S.f.ernesto=true;S.ev.push('ernesto','metricas');S.les.push('C','M','D');S.mstage=3;}
  bitCount.textContent=S.ev.length+S.les.length;
  if(n===2)zone2();else if(n===3)zone3();else{zone1();introZ1();}
}
function restart(){
  closeModal();hideMgbar();dlg.hidden=true;D.on=false;D.q=[];D.cur=null;D.done=null;D.typing=false;
  S.mode='title';S.zone=0;S.f={};S.ev=[];S.mstage=0;S.les=[];S.ents=[];S.duel=null;S.pz=null;S.soko=null;S.tiles=null;resetPlayer(70,310);
  bitCount.textContent='0';showTitle();
}
const startHash=(location.hash||'').toLowerCase();
if(startHash==='#tiempo3')jumpTo(3);
else if(startHash==='#tiempo2')jumpTo(2);
else showTitle();
requestAnimationFrame(loop);
})();
</script>
